<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión Blue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a8c4f0; 
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Versión BLUE</h1>
        <p>Esta es la nueva versión final de asigancion</p>
        <p id="version-marker">Versión Blue</p>
        <p>Última actualización: <span id="timestamp"></span></p>
    </div>

    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
